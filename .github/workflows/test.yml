name: Test portable skill
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk poppler-utils
      - run: python -m pip install -r requirements-production.txt -r requirements-p1.txt
      - run: python -B -m unittest discover -s skills/circuit-teaching-video/tests -v
